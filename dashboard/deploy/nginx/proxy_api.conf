# Synergy Vessel -- forwarding to FastAPI, included by every /api location of synergy-vessel.conf (SV-07 Phase 1).

proxy_pass             http://synergy_api;
proxy_http_version     1.1;
proxy_set_header       Connection         "";
proxy_set_header       Host               $host;
proxy_set_header       X-Request-ID       $request_id;
proxy_connect_timeout  5s;

# Client address (SV-04): nginx REPLACES any X-Forwarded-For / X-Real-IP the client sent with the address nginx
# itself saw, so a client cannot inject an address. The backend trusts this header only from 127.0.0.1
# (SYNERGY_TRUSTED_PROXIES) and only when started with --no-proxy-headers.
proxy_set_header       X-Forwarded-For    $remote_addr;
proxy_set_header       X-Real-IP          $remote_addr;
proxy_set_header       X-Forwarded-Proto  $scheme;
proxy_set_header       X-Forwarded-Host   "";
proxy_set_header       Forwarded          "";

# Backend status codes and error bodies are passed through unchanged (no nginx error pages for API responses).
proxy_intercept_errors off;

# Cookies (the HttpOnly, SameSite=Strict photo cookie on /api/images) and the Authorization header pass through
# untouched; the path is not rewritten, so the cookie path /api/images stays valid.

# Never cache API responses in nginx; tell the browser not to store them unless the backend already said how.
proxy_no_cache         1;
proxy_cache_bypass     1;
include  security_headers.conf;
add_header  Cache-Control  $api_cache_control always;
