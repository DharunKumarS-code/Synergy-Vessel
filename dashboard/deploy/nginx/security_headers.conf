# Synergy Vessel -- security headers, included by every location of synergy-vessel.conf (SV-07 Phase 1).
#
# nginx rule: a location that sets ANY add_header of its own stops inheriting the server-level ones, so the
# headers live here and every location includes this file instead of relying on inheritance.

add_header  X-Content-Type-Options  "nosniff" always;
add_header  X-Frame-Options         "DENY" always;
add_header  Referrer-Policy         "same-origin" always;
add_header  Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Same-origin only. The built app has no inline scripts and loads nothing from other sites; Gemini / Groq are
# called by the BACKEND, never by the browser, so they need no entry here. 'unsafe-inline' is allowed for styles
# only (React style attributes). Photos are same-origin (/api/images); data:/blob: cover icons and the full-size
# viewer / report downloads.
add_header  Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
