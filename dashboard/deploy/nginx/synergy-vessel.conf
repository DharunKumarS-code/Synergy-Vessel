# Synergy Vessel -- local reverse proxy / single entry point (nginx). 2026-11-23, hardened 2026-11-24 (SV-07 Phase 1).
#
#   Browser --> http://127.0.0.1:8088 --> nginx --+-- /api/*  --> FastAPI (uvicorn, 127.0.0.1:8000)
#                                                 +-- /*      --> built React app (dashboard/frontend/dist)
#
# Local use only: it listens on 127.0.0.1, so nothing is exposed to the network. No domain and no
# certificate is configured; an HTTPS template is at the end (commented out).
#
# Files: this file + security_headers.conf + proxy_api.conf (same folder; included below).
#
# Run (see dashboard/INFRASTRUCTURE.md, "Reverse proxy"; nginx for Windows is unpacked at C:\tools\nginx-1.30.8):
#   1. Build the frontend:            cd dashboard/frontend ; npm run build
#   2. Start the backend on 127.0.0.1:8000 with --no-proxy-headers and SYNERGY_TRUSTED_PROXIES=127.0.0.1
#      (SV-04: the backend then takes the client address from the X-Forwarded-For value set below).
#   3. Create the folders nginx writes to (once):  dashboard/deploy/nginx/logs  and  dashboard/deploy/nginx/temp
#   4. Check, then start:  nginx -p "<project>/dashboard/deploy/nginx/" -c synergy-vessel.conf -t
#                          nginx -p "<project>/dashboard/deploy/nginx/" -c synergy-vessel.conf
#      Stop:               nginx -p "<project>/dashboard/deploy/nginx/" -c synergy-vessel.conf -s quit
# Adjust the `root` path below if the project is not at E:/Synergy Vessel.

worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    # Self-contained MIME types (no dependency on nginx's own mime.types file location).
    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js mjs;
        application/json          json map;
        image/svg+xml             svg;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/x-icon              ico;
        font/woff2                woff2;
        text/csv                  csv;
        application/pdf           pdf;
    }
    default_type  application/octet-stream;

    log_format  main  '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time '
                      'rid=$request_id';
    access_log  logs/access.log  main;

    client_body_temp_path  temp/client_body;
    proxy_temp_path        temp/proxy;
    fastcgi_temp_path      temp/fastcgi;
    uwsgi_temp_path        temp/uwsgi;
    scgi_temp_path         temp/scgi;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    autoindex          off;   # never list a folder's contents

    # The inspection list is ~1 MB of JSON; compression makes it a fraction of that.
    gzip               on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types         application/json application/javascript text/css text/csv image/svg+xml;

    # API responses must not be stored by the browser or any cache: when the backend sets no Cache-Control of its
    # own, nginx adds "no-store". Responses that already carry one (photos: "private, no-cache"; reports:
    # "no-store") keep it unchanged. An empty value means nginx adds no header.
    map $upstream_http_cache_control $api_cache_control {
        ""       "no-store";
        default  "";
    }

    upstream synergy_api {
        server 127.0.0.1:8000;   # the single FastAPI instance (see INFRASTRUCTURE.md, "Load balancing")
        keepalive 16;
    }

    server {
        listen       127.0.0.1:8088;   # 8080 is taken by another program on this computer
        server_name  localhost;

        root  "E:/Synergy Vessel/dashboard/frontend/dist";
        index index.html;

        # Small requests by default; only the Excel upload endpoints accept large bodies (below).
        client_max_body_size  2m;

        include  security_headers.conf;

        # ---------------------------------------------------------------- never served
        # Hidden files (.env, .git, .htaccess ...) and file types that never belong in the built app.
        location ~ /\. {
            return 404;
        }
        location ~* \.(env|ini|cfg|conf|log|py|pyc|sh|ps1|bat|bak|old|orig|swp|sql|sqlite|db|jsonl|key|pem|crt|yml|yaml|toml|lock|xlsx?)$ {
            return 404;
        }

        # ---------------------------------------------------------------- API -> FastAPI
        # Only /api/ is forwarded: the backend's /docs and /openapi.json are not reachable through the proxy.
        # Unknown /api/... paths get FastAPI's own JSON 404 -- they never fall through to index.html.
        # ^~ : API (and asset) prefixes win over the regex block-list above, so e.g. a report URL ending in .xlsx works.
        location ^~ /api/ {
            include  proxy_api.conf;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
        }
        location = /api {
            default_type  application/json;
            return 404 '{"detail":"Not Found"}';
        }

        # AI condition analysis can take minutes (provider retries); the browser itself waits up to 330 s.
        location = /api/ai-analysis/compare {
            include  proxy_api.conf;
            proxy_send_timeout     60s;
            proxy_read_timeout     360s;
        }

        # Excel workbook uploads: the backend accepts up to 60 MB (MAX_UPLOAD_BYTES); the browser waits 300 s.
        location ^~ /api/imports {
            client_max_body_size   64m;
            proxy_request_buffering on;
            include  proxy_api.conf;
            proxy_send_timeout     330s;
            proxy_read_timeout     330s;
        }

        # PDF / CSV reports are generated on request; the browser waits up to 120 s.
        location ^~ /api/reports/ {
            include  proxy_api.conf;
            proxy_send_timeout     60s;
            proxy_read_timeout     150s;
        }

        # ---------------------------------------------------------------- frontend (static files)
        # Vite puts a content hash in every asset name, so assets can be cached for a long time.
        # A missing asset is a plain 404 (never index.html).
        location ^~ /assets/ {
            include  security_headers.conf;
            add_header  Cache-Control  "public, max-age=31536000, immutable" always;
            try_files  $uri =404;
        }

        # Client-side routes (/compare, /reviews, ...) all load index.html, which is never cached, so a new build
        # is picked up on the next page load.
        location / {
            try_files  $uri /index.html;
        }
        location = /index.html {
            include  security_headers.conf;
            add_header  Cache-Control  "no-cache" always;
        }
    }

    # ---------------------------------------------------------------- HTTPS (future; not enabled)
    # server {
    #     listen       443 ssl;
    #     server_name  <your-host-name>;
    #     ssl_certificate      <path-to-certificate.pem>;
    #     ssl_certificate_key  <path-to-private-key.pem>;
    #     ssl_protocols        TLSv1.2 TLSv1.3;
    #     add_header  Strict-Transport-Security  "max-age=31536000" always;
    #     # ... same root and location blocks as above; the backend then marks the photo cookie Secure ...
    # }
}
