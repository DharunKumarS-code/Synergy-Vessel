name: CI



on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # weekly (Monday 05:17 UTC): new advisories show up even without code changes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SYNERGY_AI_PROVIDER: disabled
  SYNERGY_AI_ALLOW_LIVE: "0"
  SYNERGY_LOCATION_AI_PROVIDER: disabled
  SYNERGY_LOCATION_AI_ALLOW_LIVE: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend (FastAPI) tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard/backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dashboard/backend/requirements*.txt

      - name: Install backend dependencies (exact versions, hash-checked)
        run: |
          python -m pip install "pip==26.3"
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Check installed dependencies are consistent
        run: python -m pip check

      - name: Basic validation (byte-compile and import the app)
        run: |
          python -m compileall -q app
          python -c "import app.main"

      - name: Run backend tests
        run: python -m pytest -p no:warnings

  frontend:
    name: Frontend (React) tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the Python audit tool
        run: |
          python -m pip install "pip==26.3"
          python -m pip install "pip-audit==2.10.1"

      # Shipped (runtime) frontend packages: any HIGH or CRITICAL advisory fails the job.
      - name: npm audit - runtime packages (fails on high or critical)
        working-directory: dashboard/frontend
        run: npm audit --omit=dev --audit-level=high

      # Build and test tools never reach the browser; their advisories are listed for review without failing.
      - name: npm audit - all packages including build and test tools (report only)
        working-directory: dashboard/frontend
        run: npm audit || echo "::warning title=npm audit (dev tools)::advisories in build/test-only packages - see the log above"

      # Python: every locked package of the backend and the automation; any known vulnerability fails the job.
      - name: pip-audit - backend lock
        run: python -m pip_audit --require-hashes --disable-pip -r dashboard/backend/requirements-dev.txt --desc on

      - name: pip-audit - automation lock
        run: python -m pip_audit --require-hashes --disable-pip -r automation/requirements-dev.txt --desc on
