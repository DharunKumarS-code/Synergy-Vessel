# Synergy Vessel -- Dependabot (SV-07). Dependabot only OPENS pull requests; nothing is merged automatically.
# Every pull request runs the CI workflow (tests, build and the dependency audit), and a person reviews and merges.
#
# Patch and minor updates of each ecosystem are grouped into ONE weekly pull request to avoid noise.
# Major-version updates are never grouped: each arrives as its own pull request for separate manual review.
# Security updates (Dependabot alerts) are opened as soon as an advisory is published, independent of this schedule.
#
# Python folders use the pip-tools layout: requirements.in (top-level) -> requirements.txt (exact versions + hashes).
# Dependabot updates the .in ranges if needed and regenerates the hashed lock files.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/dashboard/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "deps(backend)"
    groups:
      backend-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/automation"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "automation"]
    commit-message:
      prefix: "deps(automation)"
    groups:
      automation-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(ci)"
    groups:
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]
